# ═══════════════════════════════════════════════════════════════════════
#  GitHub Actions Workflow  –  PDF Extractor → Windows .exe
# ═══════════════════════════════════════════════════════════════════════
#
#  Was passiert hier?
#  -  GitHub stellt einen Windows-Server bereit
#  -  Python installiert + alle Abhängigkeiten
#  -  PyInstaller baut daraus eine .exe
#  -  Die .exe wird als "Artifact" zum Download bereitgestellt
#
#  Auslöser:
#  -  Automatisch bei jedem Push auf den "main"-Branch
#  -  Manuell über den "Run workflow"-Button in GitHub
#
# ═══════════════════════════════════════════════════════════════════════

name: "🔨 Build Windows EXE"

# ── Wann soll der Workflow laufen? ───────────────────────────────────
on:
  push:
    branches: [ main ]          # bei jedem Push auf main
  workflow_dispatch:             # oder manuell per Knopfdruck in GitHub

jobs:
  build:
    name: "Windows EXE bauen"
    runs-on: windows-latest      # <-- läuft auf Windows!

    steps:

      # ── 1. Repository auschecken ───────────────────────────────────
      - name: "Code auschecken"
        uses: actions/checkout@v4

      # ── 2. Python installieren ─────────────────────────────────────
      - name: "Python 3.11 einrichten"
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ── 3. Abhängigkeiten installieren ─────────────────────────────
      - name: "Python-Pakete installieren"
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pdfplumber pandas openpyxl

      # ── 4. EXE bauen ──────────────────────────────────────────────
      - name: "EXE mit PyInstaller erstellen"
        run: |
          pyinstaller --onefile --noconsole --name "PDF_Extractor" pdf_extractor_gui.py

      # ── 5. EXE als Artifact hochladen ──────────────────────────────
      #    → Danach unter "Actions" → Workflow-Run → "Artifacts"
      #      zum Download verfügbar
      - name: "EXE als Artifact bereitstellen"
        uses: actions/upload-artifact@v4
        with:
          name: PDF_Extractor_Windows
          path: dist/PDF_Extractor.exe
          retention-days: 90
